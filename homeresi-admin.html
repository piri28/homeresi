<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homeresi - Admin Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #0d1b2a; color: #fff; padding: 40px; }
    h1 { color: #00b4d8; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1b263b; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #415a77; }
    th { background-color: #415a77; color: #fff; text-transform: uppercase; font-size: 14px; }
    tr:hover { background-color: #2b3a55; }
    .status-badge { padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; background: #f39c12; color: #fff; }
    #adminContent { display: none; }
  </style>

  <!-- Passcode Protection Script -->
  <script>
    function checkAdminAccess() {
      var entered = prompt("Please enter the Admin Password:");
      if (!entered) {
        window.location.href = "index.html";
        return;
      }
      var secureCheck = entered.split("").reverse().join("");
      if (secureCheck !== "8214.imaM") {
        alert("Access Denied! Incorrect password.");
        window.location.href = "index.html";
      } else {
        // If password is correct, wait for DOM to load and display the panel
        document.addEventListener("DOMContentLoaded", function() {
          document.getElementById("adminContent").style.display = "block";
          loadApplications(); // Fetch data from Firebase
        });
      }
    }
    checkAdminAccess();
  </script>

  <!-- Firebase SDK Libraries -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Your Firebase Configuration Keys
    const firebaseConfig = {
      apiKey: "AIzaSyCqshvC9T131s44rD7pGO2LQwa_3Ay68AE",
      authDomain: "homeresi-new.firebaseapp.com",
      projectId: "homeresi-new",
      storageBucket: "homeresi-new.firebasestorage.app",
      messagingSenderId: "447512997027",
      appId: "1:447512997027:web:cbf6bccb9ae28a509f2316"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Function to fetch data from Firestore and update the table
    window.loadApplications = async function() {
      const tableBody = document.getElementById("tableBody");
      tableBody.innerHTML = "<tr><td colspan='3' style='text-align:center;'>Loading applications...</td></tr>";

      try {
        const q = query(collection(db, "applications"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);
        
        tableBody.innerHTML = ""; // Clear loading text

        if (querySnapshot.empty) {
          tableBody.innerHTML = "<tr><td colspan='3' style='text-align:center;'>No applications found.</td></tr>";
          return;
        }

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const row = document.createElement("tr");

          // Format Date
          let dateStr = "N/A";
          if (data.createdAt) {
            const date = data.createdAt.toDate();
            dateStr = date.toLocaleString();
          }

          row.innerHTML = `
            <td>${data.email || "No Email"}</td>
            <td><span class="status-badge">${data.status || "Pending"}</span></td>
            <td>${dateStr}</td>
          `;
          tableBody.appendChild(row);
        });
      } catch (error) {
        tableBody.innerHTML = <tr><td colspan='3' style='text-align:center; color:#e63946;'>Error loading data: ${error.message}</td></tr>;
      }
    }
  </script>
</head>
<body>

  <!-- Main Admin Dashboard Area -->
  <div id="adminContent">
    <h1>Homeresi Admin Dashboard</h1>
    <p>Below is the live list of tenant trust score requests received from the platform.</p>
    
    <table>
      <thead>
        <tr>
          <th>Tenant Email</th>
          <th>Status</th>
          <th>Submission Date</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- Live Data Will Be Inserted Here -->
      </tbody>
    </table>
  </div>

</body>
</html>
