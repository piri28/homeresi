<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homeresi — NYC Tenant Reviews & Apartment Ratings</title>
<meta name="description" content="Honest tenant reviews for NYC apartment buildings. Read and write reviews, see star ratings, and find the best buildings in New York City.">
<link rel="icon" type="image/png" href="/favicon.png">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "NYC Building Reviews",
  "image": "https://www.homeresi.com/favicon.png",
  "description": "Real tenant reviews and building insights for New York City apartments.",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "New York City",
    "addressLocality": "Manhattan",
    "addressRegion": "NY",
    "addressCountry": "US"
  },
  "aggregateRating": {
    "@type": "AggregateRating",
    "ratingValue": "4.8",
    "reviewCount": "24",
    "bestRating": "5",
    "worstRating": "1"
  }
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
  import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAnalytics }    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
  import {
    getFirestore, collection, doc,
    setDoc, updateDoc, onSnapshot,
    arrayUnion, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // FIREBASE CONFIG
  const firebaseConfig = {
    apiKey:            "AIzaSyBHn_OIdaGtvIwHl-kKHv1URPWCdsC-ygc",
    authDomain:        "homeresi.firebaseapp.com",
    projectId:         "homeresi",
    storageBucket:     "homeresi.firebasestorage.app",
    messagingSenderId: "1044254777018",
    appId:             "1:1044254777018:web:f01ebcffc70401b705ac83",
    measurementId:     "G-VPQCCNTQZ7"
  };
  const app       = initializeApp(firebaseConfig);
  const db        = getFirestore(app);
  const BUILDINGS = collection(db, "buildings");
  const cache = {};

  // MAP INIT
  const map = L.map('map', { center:[40.7128,-74.0060], zoom:13, zoomControl:true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© OpenStreetMap contributors', maxZoom:19
  }).addTo(map);
  const leafletMarkers = {};

  // CALCULATIONS
  const avgRating = b => (!b.reviews||!b.reviews.length) ? 0 : b.reviews.reduce((s,r)=>s+r.rating,0)/b.reviews.length;
  const ratingColor = avg => avg>=4?'#2d7a4f':avg>=2.5?'#e8a020':'#c93030';
  const starStr = n => [1,2,3,4,5].map(i=>i<=n?'★':'☆').join('');
  const escHtml = s => s.replace(/'/g,"\\'").replace(/"/g,'&quot;');
  const formatDate = d => { try{return new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});}catch{return d;} };

  function showToast(msg, isError=false) {
    const t=document.getElementById('toast');
    t.textContent=msg; t.className='toast'+(isError?' error':'');
    t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3200);
  }

  // MARKER ICON LOGIC
  function createMarkerIcon(b) {
    const avg=avgRating(b), hasR=b.reviews&&b.reviews.length;
    const color=hasR?ratingColor(avg):'#e8a020', label=hasR?avg.toFixed(1):'+';
    return L.divIcon({
      className:'',
      html:`<div style="width:38px;height:38px;background:${color};border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #0f0e0d;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.5);cursor:pointer;"><span style="transform:rotate(45deg);font-size:11px;font-weight:800;color:#0f0e0d;font-family:'Syne',sans-serif;line-height:1">${label}</span></div>`,
      iconSize:[38,38],iconAnchor:[19,38],popupAnchor:[0,-38]
    });
  }

  function placeLeafletMarker(b) {
    if(leafletMarkers[b.id]) map.removeLayer(leafletMarkers[b.id]);
    const m=L.marker([b.lat,b.lng],{icon:createMarkerIcon(b)}).addTo(map);
    const avg=avgRating(b), rc=b.reviews?b.reviews.length:0;
    const rt=rc?`${starStr(Math.round(avg))} <strong>${avg.toFixed(1)}</strong> (${rc} review${rc!==1?'s':''})`:'No reviews yet';
    m.bindPopup(`<div class="popup-addr">${b.name||b.address.split(',')[0]}</div>
      <div style="font-size:.72rem;color:#7a7570;margin-bottom:4px">${b.address}</div>
      <div class="popup-rating">${rt}</div>
      <button class="popup-btn" onclick="window._openPanel('${b.id}')">Read Reviews →</button>`);
    m.on('click',()=>openPanel(b.id));
    leafletMarkers[b.id]=m;
  }

  // FIRESTORE LISTENER
  onSnapshot(BUILDINGS, snap=>{
    snap.docChanges().forEach(ch=>{
      const d={id:ch.doc.id,...ch.doc.data()};
      if(!d.reviews) d.reviews=[];
      if(ch.type==='added'||ch.type==='modified'){
        cache[d.id]=d; placeLeafletMarker(d);
        if(ch.type==='modified'&&d.id===currentBuildingId){
          renderPanel(d);
          if(leafletMarkers[d.id]) leafletMarkers[d.id].setIcon(createMarkerIcon(d));
        }
      }
    });
    updateStats(); renderRecentReviews();
  });

  async function saveNewBuilding(b) {
    await setDoc(doc(BUILDINGS,b.id),{lat:b.lat,lng:b.lng,address:b.address,name:b.name,reviews:b.reviews,createdAt:serverTimestamp()});
  }

  let tempMarker=null;
  map.on('click', async e=>{
    const {lat,lng}=e.latlng;
    if(tempMarker) map.removeLayer(tempMarker);
    tempMarker=L.marker([lat,lng],{icon:L.divIcon({className:'',
      html:`<div style="width:20px;height:20px;background:#f5c84a;border-radius:50%;border:3px solid #0f0e0d;animation:pulse2 1s infinite"></div>`,
      iconSize:[20,20],iconAnchor:[10,10]})}).addTo(map);
    const address=await reverseGeocode(lat,lng);
    openNewBuildingPanel(lat,lng,address);
  });

  async function reverseGeocode(lat,lng){
    try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);const d=await r.json();return d.display_name||`${lat.toFixed(5)},${lng.toFixed(5)}`;}
    catch{return`${lat.toFixed(5)},${lng.toFixed(5)}`;}
  }

  const searchInput=document.getElementById('search-input');
  const searchResults=document.getElementById('search-results');
  let st;
  searchInput.addEventListener('input',()=>{
    clearTimeout(st); const q=searchInput.value.trim();
    if(q.length<3){searchResults.classList.remove('show');return;}
    st=setTimeout(()=>doSearch(q),400);
  });

  async function doSearch(q){
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q+' New York City')}&limit=5&addressdetails=1`);
      const res=await r.json();
      searchResults.innerHTML=res.length
        ?res.map(r=>`<div class="search-result-item" onclick="window._goToLocation(${r.lat},${r.lon},'${escHtml(r.display_name)}')"><div class="addr-main">${r.display_name.split(',')[0]}</div><div class="addr-sub">${r.display_name.split(',').slice(1,3).join(',')}</div></div>`).join('')
        :'<div class="search-result-item">No results found</div>';
      searchResults.classList.add('show');
    }catch{}
  }
  window._goToLocation=(lat,lng,addr)=>{map.flyTo([lat,lng],17,{duration:1.2});searchResults.classList.remove('show');searchInput.value=addr.split(',')[0];};

  const sidePanel=document.getElementById('side-panel');
  const panelInner=document.getElementById('panel-inner');
  let currentBuildingId=null;
  const selectedRating={};

  function openPanel(id){
    currentBuildingId=id; const b=cache[id]; if(!b) return;
    sidePanel.classList.add('open'); document.body.classList.add('panel-open');
    renderPanel(b);
    map.flyTo([b.lat,b.lng],Math.max(map.getZoom(),15),{duration:.8});
    if(tempMarker){map.removeLayer(tempMarker);tempMarker=null;}
  }
  window._openPanel=openPanel;

  function renderRecentReviews(){
    const el=document.getElementById('recent-reviews-list'); if(!el) return;
    const all=[];
    Object.values(cache).forEach(b=>(b.reviews||[]).forEach(r=>all.push({...r,buildingName:b.name||b.address.split(',')[0],buildingAddr:b.address,buildingId:b.id})));
    all.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const recent=all.slice(0,12);
    if(!recent.length){el.innerHTML='<p class="rr-empty">No reviews yet!</p>';return;}
    el.innerHTML=recent.map(r=>`
      <article class="rr-card" onclick="window._openPanel('${r.buildingId}')">
        <div class="rr-top">
          <div class="rr-stars">${[1,2,3,4,5].map(i=>`<span style="color:${i<=r.rating?'#e8a020':'#3a3834'}">★</span>`).join('')}</div>
          <time class="rr-date">${formatDate(r.date)}</time>
        </div>
        <div class="rr-building"><a href="/building/${r.buildingId}" style="text-decoration:none;color:inherit;font-weight:bold;">${r.buildingName}</a></div>
        <div class="rr-addr">${r.buildingAddr.split(',').slice(1,3).join(',').trim()}</div>
        <p class="rr-text">${r.text.length>100?r.text.slice(0,100)+'…':r.text}</p>
        <div class="rr-author">— ${r.author}</div>
      </article>`).join('');
  }

  function updateStats(){
    const bs=Object.values(cache);
    document.getElementById('stat-buildings').textContent=bs.length;
    document.getElementById('stat-reviews').textContent=bs.reduce((s,b)=>s+(b.reviews?b.reviews.length:0),0);
  }

  window._closePanel=()=> { sidePanel.classList.remove('open'); document.body.classList.remove('panel-open'); };
  window._setRating=(btn,id)=>{
    const v=parseInt(btn.dataset.val); selectedRating[id]=v;
    btn.closest('.star-picker').querySelectorAll('.star-btn').forEach((b,i)=>b.classList.toggle('active',i<v));
  };
</script>

<style>
  :root {
    --ink: #0f0e0d; --paper: #f5f0e8; --amber: #e8a020; --amber-light: #f5c84a;
    --red: #c93030; --green: #2d7a4f; --panel: #1a1916; --panel-border: #2e2c29;
    --muted: #7a7570; --star-fill: #e8a020; --star-empty: #3a3834;
    --radius: 12px; --radius-sm: 6px; --header-h: 56px;
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--ink); color:var(--paper); min-height:100vh; overflow-x:hidden; }

  /* SEO H1 Header */
  .seo-title {
    background: #000; color: var(--amber); font-family:'Syne',sans-serif;
    font-size: 0.9rem; text-align: center; padding: 10px; font-weight: 700;
    border-bottom: 1px solid var(--panel-border);
  }

  header {
    background:var(--panel); border-bottom:1px solid var(--panel-border);
    padding:0 16px; height:var(--header-h); display:flex; align-items:center; gap:12px;
    position:sticky; top:0; z-index:1000;
  }
  .logo { font-family:'Syne',sans-serif; font-weight:800; font-size:1.1rem; }
  .logo span { color:var(--amber); }

  .search-wrap { flex:1; position:relative; }
  .search-wrap input {
    width:100%; background:#242220; border:1px solid var(--panel-border);
    border-radius:var(--radius-sm); padding:10px 14px; color:var(--paper); outline:none; font-size: 16px;
  }

  #search-results {
    position:absolute; top:100%; left:0; right:0; background:var(--panel);
    border:1px solid var(--panel-border); z-index:2000; display:none;
  }
  #search-results.show { display:block; }
  .search-result-item { padding:10px; border-bottom:1px solid var(--panel-border); cursor:pointer; font-size:0.8rem; }

  .app-body { display:flex; flex-direction:column; flex:1; }

  /* RESPONSIVE MAP */
  #map {
    height: 60vh; /* Covers 60% of screen height on mobile */
    min-height: 350px; flex-shrink:0; position:relative;
  }

  #side-panel {
    background:var(--panel); border-top:1px solid var(--panel-border);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .panel-inner { padding: 20px; overflow-y: auto; }

  /* SEO LIST */
  #recent-reviews { background:var(--panel); padding:24px 16px; border-top:2px solid var(--panel-border); }
  .rr-title { font-family:'Syne',sans-serif; font-size:1rem; margin-bottom:15px; }
  #recent-reviews-list { display:flex; gap:12px; overflow-x:auto; padding-bottom:10px; }
  .rr-card {
    background:#242220; border:1px solid var(--panel-border); border-radius:var(--radius);
    padding:14px; min-width:240px; flex-shrink:0;
  }

  /* TABLET AND DESKTOP */
  @media (min-width:768px){
    .app-body { flex-direction:row; height:calc(100vh - var(--header-h) - 40px); }
    #map { height:auto; flex:1; }
    #side-panel { width:400px; border-top:none; border-left:1px solid var(--panel-border); }
    .seo-title { font-size: 1.1rem; }
  }

  .toast {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--green); padding:12px 24px; border-radius:24px; opacity:0; transition:0.3s;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<h1 class="seo-title">Homeresi: Real Tenant Reviews for NYC Apartments</h1>

<header>
  <div class="logo"><span>home</span>resi</div>
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="Search buildings..." autocomplete="off">
    <div id="search-results"></div>
  </div>
  <div class="header-stats" style="font-size: 0.7rem; color: var(--muted);">
    <strong id="stat-buildings" style="color:var(--amber)">0</strong> bldgs
  </div>
</header>

<div class="app-body">
  <div id="map"></div>
  <div id="side-panel">
    <div class="panel-inner" id="panel-inner">
      <div style="text-align:center; padding:40px 0; color:var(--muted)">
        <h3>Select a building</h3>
        <p>Tap a pin to read reviews</p>
      </div>
    </div>
  </div>
</div>

<section id="recent-reviews">
  <h2 class="rr-title">Recent Reviews</h2>
  <div id="recent-reviews-list"></div>
</section>

<footer style="padding:20px; text-align:center; font-size:0.8rem; color:var(--muted);">
  © 2026 Homeresi | <a href="/privacy.html" style="color:var(--amber); text-decoration:none;">Privacy</a>
</footer>

<div id="toast" class="toast"></div>
</body>
</html>
