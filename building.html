<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Apartment & Building Reviews | Homeresi</title>
    <meta name="description" content="Read real tenant reviews for NYC buildings. Find the truth before you move.">
    <link rel="icon" type="image/png" href="/favicon.png">

    <script type="application/ld+json" id="static-schema">
    {
      "@context": "https://schema.org",
      "@type": "ApartmentComplex",
      "name": "NYC Building Reviews",
      "description": "Tenant reviews and building ratings for NYC apartments.",
      "image": "https://www.homeresi.com/favicon.png",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "New York City",
        "addressLocality": "Manhattan",
        "addressRegion": "NY",
        "addressCountry": "US"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "itemReviewed": {
          "@type": "ApartmentComplex",
          "name": "NYC Building Reviews"
        },
        "ratingValue": "4.5",
        "reviewCount": "12",
        "bestRating": "5",
        "worstRating": "1"
      }
    }
    </script>
</head>
<body>

<div class="container">
    <div id="status-message" style="padding: 20px; text-align: center;">Loading NYC Building Data...</div>

    <div id="content" style="display: none; padding: 20px;">
        <h1 id="building-name">Loading...</h1>
        <p id="building-address" style="color: gray;"></p>
        <hr>
        <h3>Tenant Reviews</h3>
        <div id="reviews-list"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBHn_OIdaGtvIwHl-kKHv1URPWCdsC-ygc",
      authDomain: "homeresi.firebaseapp.com",
      projectId: "homeresi",
      storageBucket: "homeresi.appspot.com",
      messagingSenderId: "1044254777018",
      appId: "1:1044254777018:web:f01ebcffc70401b705ac83"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const getID = () => {
      const parts = window.location.pathname.split('/');
      return parts[parts.length - 1];
    };

    const buildingId = getID();

    if (buildingId) {
      db.collection("buildings").doc(buildingId).get().then((doc) => {
        if (doc.exists) {
          const data = doc.data();
          
          // Update Page UI
          document.getElementById("building-name").innerText = data.name || "Building";
          document.getElementById("building-address").innerText = data.address || "NYC";
          document.title = (data.name || "Building") + " - Reviews | Homeresi";

          // Update Reviews
          const list = document.getElementById("reviews-list");
          if (data.reviews && data.reviews.length > 0) {
            list.innerHTML = "";
            data.reviews.forEach(r => {
              const div = document.createElement("div");
              div.style.marginBottom = "15px";
              div.innerHTML = `<strong>${r.author || 'Tenant'}:</strong> <p>${r.text || ''}</p><small>Rating: ${r.rating}/5</small>`;
              list.appendChild(div);
            });
          } else {
            list.innerHTML = "No reviews yet.";
          }

          // Show Content
          document.getElementById("status-message").style.display = "none";
          document.getElementById("content").style.display = "block";

          // OPTIONAL: Update Schema with Real Data for modern bots
          const staticSchema = document.getElementById('static-schema');
          if (staticSchema) {
            const currentSchema = JSON.parse(staticSchema.text);
            currentSchema.name = data.name;
            currentSchema.itemReviewed.name = data.name;
            staticSchema.text = JSON.stringify(currentSchema);
          }

        } else {
          document.getElementById("status-message").innerText = "Building not found.";
        }
      }).catch((err) => {
        console.error(err);
        document.getElementById("status-message").innerText = "Connection error.";
      });
    }
</script>
</body>
</html>
