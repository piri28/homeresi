<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Apartment & Building Reviews | Homeresi</title>
    <meta name="description" content="Read real tenant reviews for NYC buildings. Find the truth before you move.">
    <link rel="icon" type="image/png" href="/favicon.png">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ApartmentComplex",
      "name": "NYC Apartment Reviews",
      "image": "https://www.homeresi.com/favicon.png",
      "description": "Tenant reviews and building insights for NYC apartments.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "New York City",
        "addressLocality": "Manhattan",
        "addressRegion": "NY",
        "addressCountry": "US"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "reviewCount": "24",
        "bestRating": "5",
        "worstRating": "1"
      }
    }
    </script>
</head>
<body>

<div class="container">
    <h1 id="building-name" style="text-align:center; margin-top:20px;">NYC Building Reviews</h1>
    
    <div id="status-message" style="text-align:center; padding:20px;">Fetching latest data...</div>

    <div id="content" style="display: none; padding: 20px;">
        <p id="building-address" style="color: gray;"></p>
        <hr>
        <h3>Tenant Reviews</h3>
        <div id="reviews-list"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBHn_OIdaGtvIwHl-kKHv1URPWCdsC-ygc",
      authDomain: "homeresi.firebaseapp.com",
      projectId: "homeresi",
      storageBucket: "homeresi.appspot.com",
      messagingSenderId: "1044254777018",
      appId: "1:1044254777018:web:f01ebcffc70401b705ac83"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const buildingId = window.location.pathname.split('/').pop();

    if (buildingId) {
      db.collection("buildings").doc(buildingId).get().then((doc) => {
        if (doc.exists) {
          const data = doc.data();
          
          // Update Page UI
          document.getElementById("building-name").innerText = data.name || "Building";
          document.getElementById("building-address").innerText = data.address || "New York City";
          document.title = (data.name || "Building") + " - Reviews | Homeresi";

          // Show real reviews
          const list = document.getElementById("reviews-list");
          if (data.reviews && data.reviews.length > 0) {
            list.innerHTML = "";
            data.reviews.forEach(r => {
              const div = document.createElement("div");
              div.style.padding = "10px 0";
              div.style.borderBottom = "1px solid #eee";
              div.innerHTML = `<strong>${r.author || 'Tenant'}:</strong> <p>${r.text || ''}</p><small>Rating: ${r.rating}/5</small>`;
              list.appendChild(div);
            });
          } else {
            list.innerHTML = "No reviews yet.";
          }

          document.getElementById("status-message").style.display = "none";
          document.getElementById("content").style.display = "block";
        }
      }).catch(err => console.error(err));
    }
</script>
</body>
</html>
