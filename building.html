<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Details - Homeresi</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; }
        .building-header { border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .review-card { background: #f9f9f9; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 5px solid #007bff; }
        .loading { color: #666; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <div id="loading-message" class="loading">Loading building details...</div>
    
    <div id="content" style="display: none;">
        <div class="building-header">
            <h1 id="building-name">Loading Name...</h1>
            <p id="building-address" style="color: #666;"></p>
        </div>

        <h3>User Reviews</h3>
        <div id="reviews-list">
            </div>
    </div>
</div>

<script>
    // YOUR FIREBASE CONFIGURATION
    const firebaseConfig = {
        apiKey: "AIzaSyBHn_OIdaGtvIwHl-kKHv1URPWCdsC-ygc",
        authDomain: "homeresi.firebaseapp.com",
        projectId: "homeresi",
        storageBucket: "homeresi.appspot.com",
        messagingSenderId: "1044254777018",
        appId: "1:1044254777018:web:f01ebcffc70401b705ac83"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Get Building ID from URL (e.g., /building/ID)
    const getBuildingId = () => {
        const path = window.location.pathname;
        const segments = path.split('/');
        return segments[segments.length - 1];
    };

    const buildingId = getBuildingId();

    if (buildingId) {
        // Fetch Building Data
        db.collection("buildings").doc(buildingId).get().then((doc) => {
            if (doc.exists) {
                const data = doc.data();
                document.getElementById("building-name").innerText = data.name || "Unknown Building";
                document.getElementById("building-address").innerText = data.address || "No address provided";
                
                // Show content, hide loading
                document.getElementById("loading-message").style.display = "none";
                document.getElementById("content").style.display = "block";

                // Fetch Related Reviews (assuming you have a 'comments' collection)
                fetchReviews(buildingId);
            } else {
                document.getElementById("loading-message").innerText = "Building not found.";
            }
        }).catch((error) => {
            console.error("Error fetching building:", error);
            document.getElementById("loading-message").innerText = "Error loading data.";
        });
    }

    const fetchReviews = (id) => {
        const reviewsContainer = document.getElementById("reviews-list");
        db.collection("comments").where("buildingId", "==", id).get().then((querySnapshot) => {
            if (querySnapshot.empty) {
                reviewsContainer.innerHTML = "<p>No reviews yet. Be the first to review!</p>";
                return;
            }
            querySnapshot.forEach((doc) => {
                const review = doc.data();
                const card = document.createElement("div");
                card.className = "review-card";
                card.innerHTML = `<p>${review.text}</p><small>Rating: ${review.rating}/5</small>`;
                reviewsContainer.appendChild(card);
            });
        });
    };
</script>

</body>
</html>
