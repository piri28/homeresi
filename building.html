<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Apartment & Building Reviews | Homeresi</title>
<meta name="description" content="Discover the truth before you move. Read honest reviews from real tenants about NYC apartment buildings and landlords on Homeresi.">
<link rel="icon" type="image/png" href="/favicon.png">
    
    

<div class="container">
    <div id="status-message" class="loading">Fetching data from server...</div>
    <p style="opacity: 0.01;">Homeresi: Real reviews for NYC apartments. Check hidden building issues like mold, bugs, and landlord behavior before moving in.</p>

    <div id="content" style="display: none;">
        <div class="building-header">
            <h1 id="building-name">Loading...</h1>
            <p id="building-address" style="color: #7f8c8d; font-size: 1.1em;"></p>
        </div>

        <h3>Community Reviews</h3>
        <div id="reviews-list">
            </div>
    </div>
</div>

  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

  <script>
    // 1. FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyBHn_OIdaGtvIwHl-kKHv1URPWCdsC-ygc",
      authDomain: "homeresi.firebaseapp.com",
      projectId: "homeresi",
      storageBucket: "homeresi.appspot.com",
      messagingSenderId: "1044254777018",
      appId: "1:1044254777018:web:f01ebcffc70401b705ac83"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // 2. EXTRACT BUILDING ID FROM URL
    const getBuildingId = () => {
      const path = window.location.pathname;
      const segments = path.split('/');
      return segments[segments.length - 1];
    };

    const bID = getBuildingId();

    // 3. INSTANT SEO & SCHEMA (Google botu için)
    const seoData = {
      title: "NYC Apartment & Building Reviews",
      description: "Read real tenant reviews and find building insights in New York City.",
      image: "https://www.homeresi.com/favicon.png"
    };

    document.title = seoData.title + " | Homeresi";

    const richSchema = {
      "@context": "https://schema.org",
      "@type": "ApartmentComplex",
      "name": seoData.title,
      "description": seoData.description,
      "image": seoData.image,
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "New York City",
        "addressLocality": "Manhattan",
        "addressRegion": "NY",
        "addressCountry": "US"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "itemReviewed": {
          "@type": "ApartmentComplex",
          "name": seoData.title
        },
        "ratingValue": "4.5",
        "reviewCount": "15",
        "bestRating": "5",
        "worstRating": "1"
      }
    };

    const script = document.createElement('script');
    script.type = 'application/ld+json';
    script.text = JSON.stringify(richSchema);
    document.head.appendChild(script);

    // 4. FETCH DATA FROM FIREBASE
    if (bID) {
      db.collection("buildings").doc(bID).get().then((doc) => {
        if (doc.exists) {
          const data = doc.data();

          document.getElementById("building-name").innerText = data.name || "Building Details";
          document.getElementById("building-address").innerText = data.address || "NYC, New York";
          document.title = (data.name || "Building") + " - Reviews | Homeresi";

          const reviewsList = document.getElementById("reviews-list");
          if (data.reviews && Array.isArray(data.reviews) && data.reviews.length > 0) {
            reviewsList.innerHTML = ""; 
            data.reviews.forEach((r) => {
              const card = document.createElement("div");
              card.className = "review-card";
              card.innerHTML = `
                <p><strong>${r.author || 'Anonymous'}</strong></p>
                <p>${r.text || 'No comment.'}</p>
                <p>Rating: ${r.rating || 0}/5</p>
              `;
              reviewsList.appendChild(card);
            });
          } else {
            reviewsList.innerHTML = "<p>No reviews found yet. Be the first to review!</p>";
          }

          document.getElementById("status-message").style.display = "none";
          document.getElementById("content").style.display = "block";

        } else {
          document.getElementById("status-message").innerText = "Building not found in our database.";
        }
      }).catch((err) => {
        console.error("Firebase Error:", err);
        document.getElementById("status-message").innerText = "Connection error. Please try again later.";
      });
    } else {
      document.getElementById("status-message").innerText = "Invalid URL. Missing building ID.";
    }
  </script>


</body>
</html>
