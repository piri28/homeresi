<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Apartment & Building Reviews | Homeresi</title>
    <meta name="description" content="Discover the truth before you move. Read honest reviews from real tenants about NYC apartment buildings and landlords on Homeresi.">
    <link rel="icon" type="image/png" href="/favicon.png">
    
    <style>
        /* Base Styles */
        .loading { padding: 20px; text-align: center; font-family: sans-serif; }
        .review-card { border-bottom: 1px solid #eee; padding: 15px 0; }
        #content { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div id="status-message" class="loading">Fetching data from server...</div>
    
    <div style="display:none;">
        <h2>Homeresi NYC Rental Guide</h2>
        <p>Real tenant experiences about maintenance, management, and landlord behavior in New York City.</p>
    </div>

    <div id="content" style="display: none;">
        <div class="building-header">
            <h1 id="building-name">Loading Building...</h1>
            <p id="building-address" style="color: #7f8c8d; font-size: 1.1em;"></p>
        </div>

        <h3>Community Reviews</h3>
        <div id="reviews-list"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

<script>
    // 1. FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyBHn_OIdaGtvIwHl-kKHv1URPWCdsC-ygc",
      authDomain: "homeresi.firebaseapp.com",
      projectId: "homeresi",
      storageBucket: "homeresi.appspot.com",
      messagingSenderId: "1044254777018",
      appId: "1:1044254777018:web:f01ebcffc70401b705ac83"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // 2. UTILITY: EXTRACT ID FROM URL
    const getBuildingId = () => {
      const path = window.location.pathname;
      const segments = path.split('/');
      return segments[segments.length - 1];
    };
    const bID = getBuildingId();

    // 3. SCHEMA INJECTION: Helps Google display Rich Results (Stars)
    function injectSchema(name, address, rating, count) {
        const schemaData = {
          "@context": "https://schema.org",
          "@type": "ApartmentComplex",
          "name": name,
          "description": "Tenant reviews and building ratings for " + name + " in NYC.",
          "image": "https://www.homeresi.com/favicon.png",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": address,
            "addressLocality": "New York",
            "addressRegion": "NY",
            "addressCountry": "US"
          },
          "aggregateRating": {
            "@type": "AggregateRating",
            "itemReviewed": {
                "@type": "ApartmentComplex",
                "name": name,
                "address": address
            },
            "ratingValue": rating || "4.2",
            "reviewCount": count || "1",
            "bestRating": "5",
            "worstRating": "1"
          }
        };

        // Remove old script if exists and append new one
        const oldScript = document.getElementById('dynamic-schema');
        if (oldScript) oldScript.remove();

        const script = document.createElement('script');
        script.id = 'dynamic-schema';
        script.type = 'application/ld+json';
        script.text = JSON.stringify(schemaData);
        document.head.appendChild(script);
    }

    // Default SEO data for the bot's first impression
    injectSchema("NYC Apartment Review", "New York City", "4.0", "1");

    // 4. DATABASE OPERATION: Fetch Real Building Data
    if (bID) {
      db.collection("buildings").doc(bID).get().then((doc) => {
        if (doc.exists) {
          const data = doc.data();
          const bName = data.name || "Building Details";
          const bAddr = data.address || "New York, NY";
          const bRating = data.rating || "4.5";
          const bCount = (data.reviews) ? data.reviews.length : "1";

          // Update DOM Elements
          document.getElementById("building-name").innerText = bName;
          document.getElementById("building-address").innerText = bAddr;
          document.title = bName + " - Real Tenant Reviews | Homeresi";

          // Update SEO Schema with Real Data for Google
          injectSchema(bName, bAddr, bRating, bCount);

          // Render Reviews List
          const reviewsList = document.getElementById("reviews-list");
          if (data.reviews && data.reviews.length > 0) {
            reviewsList.innerHTML = ""; 
            data.reviews.forEach((r) => {
              const card = document.createElement("div");
              card.className = "review-card";
              card.innerHTML = `
                <p><strong>${r.author || 'Anonymous Tenant'}</strong></p>
                <p>${r.text || 'No comment provided.'}</p>
                <p>⭐ ${r.rating || 0}/5</p>
              `;
              reviewsList.appendChild(card);
            });
          } else {
            reviewsList.innerHTML = "<p>No reviews found yet. Be the first to share your experience!</p>";
          }

          // Toggle Page Visibility
          document.getElementById("status-message").style.display = "none";
          document.getElementById("content").style.display = "block";

        } else {
          document.getElementById("status-message").innerText = "Building not found.";
        }
      }).catch((err) => {
        console.error("Database Error:", err);
        document.getElementById("status-message").innerText = "Connection failed. Please try again later.";
      });
    } else {
      document.getElementById("status-message").innerText = "Error: Building ID is missing in URL.";
    }
</script>

</body>
</html>
