<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Building Reviews | Homeresi</title>
    <meta name="description" content="Read real tenant reviews for NYC buildings.">
    <link rel="icon" type="image/png" href="/favicon.png">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ApartmentComplex",
      "name": "NYC Apartment & Building Reviews",
      "description": "Tenant reviews and building ratings for NYC apartments.",
      "image": "https://www.homeresi.com/favicon.png",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "New York City",
        "addressLocality": "Manhattan",
        "addressRegion": "NY",
        "addressCountry": "US"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "itemReviewed": {
          "@type": "ApartmentComplex",
          "name": "NYC Apartment & Building Reviews"
        },
        "ratingValue": "4.8",
        "reviewCount": "24",
        "bestRating": "5",
        "worstRating": "1"
      }
    }
    </script>
</head>
<body style="font-family: sans-serif; margin: 0; padding: 20px;">

<div id="main-container">
    <h1 id="building-name">NYC Building Reviews</h1>
    <p id="building-address" style="color: gray;">New York City, NY</p>
    
    <div id="status-message">Loading latest community reviews...</div>

    <div id="content" style="display: none;">
        <hr>
        <h3>Tenant Experiences</h3>
        <div id="reviews-list"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBHn_OIdaGtvIwHl-kKHv1URPWCdsC-ygc",
      authDomain: "homeresi.firebaseapp.com",
      projectId: "homeresi",
      storageBucket: "homeresi.appspot.com",
      messagingSenderId: "1044254777018",
      appId: "1:1044254777018:web:f01ebcffc70401b705ac83"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Get Building ID from URL
    const bID = window.location.pathname.split('/').pop();

    if (bID && bID !== "building") {
      db.collection("buildings").doc(bID).get().then((doc) => {
        if (doc.exists) {
          const data = doc.data();
          
          // Update Page UI
          document.getElementById("building-name").innerText = data.name || "Building";
          document.getElementById("building-address").innerText = data.address || "NYC";
          document.title = (data.name || "Building") + " - Reviews | Homeresi";

          // Render Reviews
          const list = document.getElementById("reviews-list");
          if (data.reviews && data.reviews.length > 0) {
            list.innerHTML = "";
            data.reviews.forEach(r => {
              const div = document.createElement("div");
              div.style.marginBottom = "15px";
              div.innerHTML = `<strong>${r.author || 'Anonymous Tenant'}:</strong> <p>${r.text || ''}</p><small>Rating: ${r.rating}/5</small>`;
              list.appendChild(div);
            });
          } else {
            list.innerHTML = "No reviews yet. Be the first!";
          }

          document.getElementById("status-message").style.display = "none";
          document.getElementById("content").style.display = "block";
        }
      }).catch(err => {
          console.error(err);
          document.getElementById("status-message").innerText = "Connection slow. Still trying...";
      });
    }
</script>
</body>
</html>
