<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homeresi - Application Form</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #0d1b2a; color: #fff; padding: 20px; }
    .form-container { max-width: 500px; margin: 0 auto; background: #1b263b; padding: 30px; border-radius: 8px; }
    input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: none; }
    button { background-color: #00b4d8; color: white; cursor: pointer; font-weight: bold; }
    .success-screen { display: none; text-align: center; }
  </style>

  <!-- Firebase SDK Libraries -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Your Firebase Configuration Keys
    const firebaseConfig = {
      apiKey: "AIzaSyCqshvC9T131s44rD7pGO2LQwa_3Ay68AE",
      authDomain: "homeresi-new.firebaseapp.com",
      projectId: "homeresi-new",
      storageBucket: "homeresi-new.firebasestorage.app",
      messagingSenderId: "447512997027",
      appId: "1:447512997027:web:cbf6bccb9ae28a509f2316"
    };

    // Initialize Firebase and Firestore Database
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Form Submission Function
    window.submitForm = async function(event) {
      event.preventDefault();
      
      const emailInput = document.getElementById("tenantEmail").value;
      const submitButton = document.getElementById("submitBtn");
      
      if(!emailInput) return;

      submitButton.disabled = true;
      submitButton.innerText = "Sending...";

      try {
        // Sending the data directly to Firestore database under 'applications' collection
        await addDoc(collection(db, "applications"), {
          email: emailInput,
          status: "Pending",
          createdAt: serverTimestamp()
        });

        // Toggle the UI view on success
        document.getElementById("formArea").style.display = "none";
        document.getElementById("successArea").style.display = "block";
        document.getElementById("displayEmail").innerText = emailInput;

      } catch (error) {
        alert("An error occurred: " + error.message);
        submitButton.disabled = false;
        submitButton.innerText = "Submit Request";
      }
    }
  </script>
</head>
<body>

  <div class="form-container">
    <!-- Form Area -->
    <div id="formArea">
      <h2>Homeresi Trust Score Request</h2>
      <form onsubmit="submitForm(event)">
        <label for="tenantEmail">Tenant Email Address:</label>
        <input type="email" id="tenantEmail" placeholder="example@gmail.com" required>
        <button type="submit" id="submitBtn">Submit Request</button>
      </form>
    </div>

    <!-- Success Screen (Queue Layout) -->
    <div id="successArea" class="success-screen">
      <div style="font-size: 48px; color: #2a9d8f;">✓</div>
      <p style="text-transform: uppercase; letter-spacing: 2px; color: #a8dadc;">REQUEST SENT</p>
      <h1>Your report is in queue.</h1>
      <p>Our AI engine and analyst team received your request. Your Homeresi Trust Score Report will arrive as a PDF within 4 hours.</p>
      
      <div style="background: #457b9d; padding: 15px; border-radius: 6px; margin: 20px 0;">
        <span style="font-size: 12px; display:block; opacity: 0.8;">Report will be delivered to:</span>
        <strong id="displayEmail" style="font-family: monospace;">email@example.com</strong>
      </div>
      
      <a href="index.html" style="color: #f1faee; text-decoration: none; font-size: 14px;">← Back to Homeresi</a>
    </div>
  </div>

</body>
</html>
